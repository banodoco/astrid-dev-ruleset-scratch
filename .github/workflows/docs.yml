name: Documentation integrity

# Validate every PR, and refresh the derived public feed after every main push.
# No path allowlist can silently skip a Markdown or metadata change.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, hostile/no-env]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test documentation validators
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Run repository checks
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        if: github.event_name == 'pull_request'
        run: |
          set -e
          base_sha="$PR_BASE_SHA"
          if merge_head="$(git rev-parse --verify HEAD^2 2>/dev/null)"; then
            if [ "$merge_head" != "$PR_HEAD_SHA" ]; then
              echo "Checked-out merge commit does not match the pull request head." >&2
              exit 1
            fi
            base_sha="$(git rev-parse HEAD^1)"
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/astrid_dev.py check --base "$base_sha" --event "$GITHUB_EVENT_PATH"
      - name: Validate refreshed generated views
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/astrid_dev.py sync
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/astrid_dev.py check
      - name: Run repository checks
        if: github.event_name != 'pull_request'
        run: python3 scripts/astrid_dev.py check

  refresh-generated:
    needs: documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: astrid-dev-refresh-generated
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh and verify only declared generated targets
        id: refresh
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch "https://x-access-token:${READ_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Source commit $GITHUB_SHA was superseded; a later push owns refresh."
            exit 0
          fi
          sync_log="$RUNNER_TEMP/generated-sync.log"
          sync_paths="$RUNNER_TEMP/generated-paths"
          # Repository code runs below (sync, check). It must not be able to plant
          # git configuration (a fsmonitor, an alias, a credential helper) that a
          # later git command would run while the write token exists.
          git_config_before="$(sha256sum .git/config | cut -d' ' -f1)"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/astrid_dev.py sync > "$sync_log"
          cat "$sync_log"
          # Treat sync's printed paths as a claim; verify against declarations
          # and the entire dirty tree before allowing anything into the index.
          python3 - "$sync_log" "$sync_paths" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, "scripts")
          from views import VIEWS

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          if lines == ["Views are current"]:
              printed = []
          else:
              if not lines or any(not line.startswith("Updated ") for line in lines):
                  raise SystemExit("Unexpected sync output; refusing to stage anything")
              printed = [line.removeprefix("Updated ") for line in lines]
          declared = {view.target for view in VIEWS}
          root = Path.cwd().resolve()
          if len(set(printed)) != len(printed):
              raise SystemExit("Duplicate sync path; refusing to stage anything")
          for name in printed:
              path = Path(name)
              if (name not in declared or path.is_absolute() or ".." in path.parts
                      or path.is_symlink() or not path.resolve().is_relative_to(root)
                      or not path.is_file()):
                  raise SystemExit(f"Unsafe or undeclared sync target: {name}")
          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"])
          dirty = []
          for record in status.split(b"\0"):
              if not record:
                  continue
              # Reject deletions, renames, conflicts and other unexpected kinds
              # of change; sync only creates or modifies regular target files.
              if record[:3] not in (b" M ", b"M  ", b"MM ", b" A ", b"A  ", b"AM ", b"?? "):
                  raise SystemExit("Unexpected git status; refusing to stage anything")
              dirty.append(record[3:].decode("utf-8"))
          if set(dirty) != set(printed):
              raise SystemExit("Dirty paths differ from sync output; refusing to stage anything")
          Path(sys.argv[2]).write_bytes(b"".join(name.encode("utf-8") + b"\0" for name in printed))
          PY
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/astrid_dev.py check
          if [ "$(sha256sum .git/config | cut -d' ' -f1)" != "$git_config_before" ]; then
            echo "git configuration changed during the refresh; refusing to continue" >&2
            exit 1
          fi
          mapfile -d '' -t targets < "$sync_paths"
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "Nothing changed."
            exit 0
          fi
          git add -- "${targets[@]}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Create dedicated refresh App token
        id: refresh-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GENERATED_REFRESH_APP_ID }}
          private-key: ${{ secrets.GENERATED_REFRESH_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Commit and push verified generated targets
        if: steps.refresh.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.refresh-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.refresh-token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          app_user_id="$(python3 - <<'PY'
          import json
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          username = quote(os.environ["APP_SLUG"] + "[bot]", safe="")
          request = Request(os.environ["GITHUB_API_URL"] + "/users/" + username,
                            headers={"Authorization": "Bearer " + os.environ["APP_TOKEN"],
                                     "Accept": "application/vnd.github+json"})
          with urlopen(request) as response:
              print(json.load(response)["id"])
          PY
          )"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          short_sha="$(git rev-parse --short "$GITHUB_SHA")"
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit -m "chore(generated): refresh views for $short_sha"
          if git -c core.hooksPath=/dev/null push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/main; then
            exit 0
          fi
          # Suppress only a race with a newer main, never an auth/ruleset error.
          git -c core.hooksPath=/dev/null fetch "https://x-access-token:${READ_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Main moved during refresh; a later push owns refresh."
            exit 0
          fi
          echo "Push failed while main still matches $GITHUB_SHA." >&2
          exit 1

  vision-consumer-contract:
    # The Dev exporter alone cannot prove Astrid App can render the feed.
    # Test the proposed JSON with the actual App main parser before publication.
    needs: documentation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout proposed Astrid Dev content
        uses: actions/checkout@v4
        with:
          path: astrid-dev
      - name: Checkout the live Astrid App consumer
        uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-app
          ref: main
          path: astrid-app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: astrid-app/package-lock.json
      - name: Export exactly the candidate content
        working-directory: astrid-dev
        run: python3 scripts/export_public_vision.py --output "$GITHUB_WORKSPACE/proposed-vision.json"
      - name: Install the App's test dependencies
        working-directory: astrid-app
        run: npm ci --legacy-peer-deps
      - name: Require the App parser to accept the candidate feed
        working-directory: astrid-app
        env:
          PUBLIC_VISION_FEED_FILE: ${{ github.workspace }}/proposed-vision.json
        run: npm run vision:check

  publish-vision:
    # Never publish the unreviewed content of a PR or a contributor branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [documentation, vision-consumer-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: astrid-dev-public-vision
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export validated source to a temporary file
        run: python3 scripts/export_public_vision.py --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/vision.json"
      - name: Publish feed to generated-only vision-published branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Older queued jobs must not overwrite the feed after a newer main push.
          git fetch origin refs/heads/main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "Source commit $GITHUB_SHA was superseded; a later push owns publication."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin vision-published >/dev/null 2>&1; then
            git fetch origin vision-published
            git switch -C vision-published FETCH_HEAD
          else
            git switch --orphan vision-published
            git rm -rf --cached . >/dev/null
          fi
          # The feed branch is generated output only, not a second CMS.
          cp "$RUNNER_TEMP/vision.json" vision.json
          git add vision.json
          if git diff --cached --quiet; then
            echo "Published vision feed is already current."
            exit 0
          fi
          git commit -m "publish(vision): source $GITHUB_SHA"
          git push origin HEAD:refs/heads/vision-published
