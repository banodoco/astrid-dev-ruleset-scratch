name: Route contributor review requests

# pull_request_target runs only trusted main code with issues:write.
# The contributed PR is inspected only through API metadata, never checked out.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Validate project review request and add review queue label
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/review_intake.py --event "$GITHUB_EVENT_PATH"
