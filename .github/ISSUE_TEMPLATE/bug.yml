name: Bug
description: A failure someone needs fixed or recovered from. No keys, tokens or private paths.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What went wrong, in your own words.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What I expected
      description: What you expected to happen instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Astrid version
      description: The Astrid version you run.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The steps that lead to the failure, if you know them.
  - type: input
    id: about
    attributes:
      label: About
      description: "A plan number or gap ID, if you know it. Leave empty if you are not sure."
