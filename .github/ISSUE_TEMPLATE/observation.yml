name: Observation
description: Something you saw, such as a papercut, a smell, a slow path or a suspected bug. No keys, tokens or private paths.
title: "observation: "
labels: ["observation"]
body:
  - type: textarea
    id: what
    attributes:
      label: What I saw
      description: One sentence is enough.
    validations:
      required: true
  - type: input
    id: about
    attributes:
      label: About
      description: "A plan number or gap ID, if you know it. Leave empty if you are not sure."
  - type: input
    id: version
    attributes:
      label: Astrid version
      description: The Astrid version you run, if you know it.
