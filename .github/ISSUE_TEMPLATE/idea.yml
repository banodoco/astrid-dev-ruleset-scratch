name: Idea
description: Something missing that should become possible. It may feed a gap later. No keys, tokens or private paths.
title: "idea: "
labels: ["idea"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should become possible
      description: The outcome you want, in plain words.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What exists today
      description: How it works now, or what gets in the way, if you know.
  - type: input
    id: about
    attributes:
      label: About
      description: "A plan number or gap ID, if you know it. Leave empty if you are not sure."
